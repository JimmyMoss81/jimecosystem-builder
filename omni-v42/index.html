<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMNI-JIMMOSS FULL</title><style>:root{--bg:#212121;--side:#171717;--panel:#2f2f2f;--line:#343434;--text:#ececec;--muted:#a9a9a9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif;height:100vh}.app{display:grid;grid-template-columns:260px 1fr;height:100vh}.side{background:var(--side);border-right:1px solid var(--line);padding:16px}.brand{font-weight:700;font-size:18px;margin-bottom:20px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:11px;border-radius:8px;margin:4px 0}.nav button:hover{background:#292929}.main{display:flex;flex-direction:column;min-width:0}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 18px}.top select,.top button{background:#2b2b2b;color:var(--text);border:1px solid #444;border-radius:8px;padding:8px}.chat{flex:1;overflow:auto;padding:28px max(22px,calc((100% - 820px)/2))}.msg{margin-bottom:24px;line-height:1.55}.who{font-size:12px;color:var(--muted);margin-bottom:5px}.composer{padding:16px max(20px,calc((100% - 860px)/2)) 22px}.composebox{display:flex;gap:8px;background:var(--panel);border:1px solid #494949;border-radius:18px;padding:10px}.composebox textarea{flex:1;resize:none;min-height:48px;max-height:160px;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:8px}.btn{border:0;border-radius:11px;background:#3c3c3c;color:white;padding:10px 12px}.hint{font-size:12px;color:var(--muted);margin-top:8px}.status{font-size:12px;color:var(--muted);margin-left:auto}@media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.chat{padding:20px}.composer{padding:12px}}</style></head><body><div class="app"><aside class="side"><div class="brand">OMNI-JIMMOSS FULL</div><div class="nav"><button onclick="showStatus()">Estado</button><button onclick="revenue()">Trabajar en ingresos</button><button onclick="showSuggestions()">Sugerencias</button><button onclick="addSystem('RAG, memoria, Ledger, Obsidian y Sol-Worker están conectados por el runtime local v4.2.')">Segundo Yo</button></div></aside><section class="main"><div class="top"><strong>Chat accesible</strong><select id="voice" aria-label="Voz"></select><button class="btn" onclick="testVoice()">Probar voz</button><label><input id="autoSpeak" type="checkbox" checked> Hablar respuestas</label><span id="status" class="status">Conectando...</span></div><main id="chat" class="chat" aria-live="polite"><div class="msg"><div class="who">OMNI-JIMMOSS</div><div>Interfaz v4.2 iniciada. Las respuestas de Mi Segundo Yo deben venir del runtime local real, no de una frase fija.</div></div></main><div class="composer"><div class="composebox"><button class="btn" onclick="dictate()">Micrófono</button><textarea id="input" placeholder="Escribe o dicta una orden..." aria-label="Mensaje"></textarea><button class="btn" onclick="send()">Enviar</button></div><div class="hint">Enter envía. Mayús+Enter crea una línea nueva.</div></div></section></div><script>const chat=document.getElementById('chat'),inp=document.getElementById('input'),sel=document.getElementById('voice'),st=document.getElementById('status');let voices=[];function loadVoices(){voices=speechSynthesis.getVoices();sel.innerHTML='';let pref=-1;voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' — '+v.lang;sel.appendChild(o);const n=(v.name+' '+v.lang).toLowerCase();if(pref<0&&n.includes('laura')&&n.includes('es'))pref=i});if(pref<0)pref=voices.findIndex(v=>v.lang&&v.lang.toLowerCase().startsWith('es'));if(pref>=0)sel.value=pref}speechSynthesis.onvoiceschanged=loadVoices;loadVoices();function speak(t){if(!document.getElementById('autoSpeak').checked||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),v=voices[Number(sel.value)];if(v)u.voice=v;u.lang=v?.lang||'es-ES';speechSynthesis.speak(u)}function add(who,text){const d=document.createElement('div');d.className='msg';d.innerHTML='<div class="who"></div><div></div>';d.firstChild.textContent=who;d.lastChild.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function addSystem(t){add('Sistema',t);speak(t)}async function statusCheck(){try{const r=await fetch('/api/status',{cache:'no-store'});const j=await r.json();if(j.status==='operational'){st.textContent='Conectado';add('Sistema',j.greeting||'Runtime operativo.')}else st.textContent='No operativo'}catch(e){st.textContent='Sin conexión';add('Sistema','No puedo conectar con Mi Segundo Yo: '+e.message)}}async function send(){const t=inp.value.trim();if(!t)return;add('Tú',t);inp.value='';st.textContent='Pensando...';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});const j=await r.json();const ans=j.reply||j.error||'Sin respuesta';add('Mi Segundo Yo',ans);speak(ans);st.textContent=j.route?('Ruta: '+j.route):'Conectado'}catch(e){const m='Error del runtime: '+e.message;add('Sistema',m);speak(m);st.textContent='Error'}}async function revenue(){try{const r=await fetch('/api/revenue',{method:'POST'});const j=await r.json();add('Mi Segundo Yo',j.message);speak(j.message)}catch(e){addSystem('No pude crear la misión de ingresos: '+e.message)}}async function showSuggestions(){try{const r=await fetch('/api/suggestions');const j=await r.json();const t=(j.suggestions||[]).map((x,i)=>(i+1)+'. '+x).join('\n');add('Mi Segundo Yo',t);speak(t)}catch(e){addSystem('No pude obtener sugerencias: '+e.message)}}function testVoice(){speak('Esta voz leerá las respuestas reales de Mi Segundo Yo.')}function showStatus(){statusCheck()}function dictate(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){addSystem('El dictado no está disponible en esta sesión.');return}const r=new R();r.lang='es-ES';r.interimResults=false;r.onresult=e=>{inp.value=e.results[0][0].transcript;inp.focus()};r.onerror=e=>addSystem('Dictado no disponible: '+e.error);r.start()}inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});statusCheck();</script></body></html>
